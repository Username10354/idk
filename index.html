<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/gif" href="rick.gif?v=999">
    <title>67</title>
    
    <style>
      body {
        /* Set your GIF as the background image */
        background-image: url("rick.gif");
        
        /* Make the image stretch to perfectly fill the whole screen */
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        
        /* Reset margins and ensure full screen height */
        margin: 0;
        height: 100vh;
        
        /* Text styling so your headers are readable over the GIF */
        color: white;
        text-shadow: 2px 2px 8px black;
        font-family: sans-serif;
        padding: 20px;
      }

      h1 {
        /* Forces the text container background to be see-through */
        background-color: transparent !important;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <h1>67676767</h1>
  </body>
</html>
