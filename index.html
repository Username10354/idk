<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/gif" href="rick.gif?v=999">
    <title>67</title>
    
    <style>
      /* Reset the page margins */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: black;
      }

      /* Forces the physical GIF image to act like a full screen background */
      .bg-gif {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: -1; /* Pushes the image behind the text */
      }

      /* Centers your text directly on top of the GIF layer */
      .content-layer {
        position: relative;
        z-index: 1; /* Pulls the text in front of the image */
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        
        /* Text enhancements */
        color: white;
        text-shadow: 3px 3px 12px rgba(0, 0, 0, 1);
        font-family: sans-serif;
      }

      h1 {
        font-size: 5rem;
        margin: 0;
      }
    </style>
  </head>
  <body>

    <!-- This native image tag forces Chrome to render and play the GIF -->
    <img src="rick.gif" alt="background" class="bg-gif">

    <!-- This container holds your centered text -->
    <div class="content-layer">
      <h1>67676767</h1>
    </div>

  </body>
</html>
